<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {

}
header::before {
  content: ""; position: absolute; top: -60%; left: -20%; width: 140%; height: 140%;
  background: radial-gradient(ellipse at 30% 50%, rgba(191,155,112,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.header-dec {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  width: 60px; height: 2px; background: rgba(191,155,112,0.5);
}
.header-dec::before, .header-dec::after {
  content: ""; position: absolute; top: -3px; width: 8px; height: 8px;
  border-radius: 50%; background: #bf9b70;
}
.header-dec::before { left: -4px; }
.header-dec::after { right: -4px; }
header h1 { font-size: 32px; font-weight: 700; letter-spacing: 2px; margin-bottom: 6px; position: relative; }
header h1 span { color: #bf9b70; }
header .sub { color: rgba(255,255,255,0.6); font-size: 15px; font-weight: 400; letter-spacing: 1px; }
header .stats {

  font-size: 13px; color: rgba(255,255,255,0.5);
}
header .stats span { display: flex; align-items: center; gap: 4px; }

/* ── Container ── */
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

/* ── Category Tabs ── */
.tabs {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin: -20px auto 28px;
  position: relative; z-index: 10;
}
.tab {
  padding: 10px 22px; border-radius: 100px; border: none;

.tab.active { background: #bf9b70; color: #fff; box-shadow: 0 4px 14px rgba(191,155,112,0.35); }

.grid {

}
.card {

  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer; position: relative;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

.card-inner { padding: 20px 22px 18px; }

.card-header {

}
.card-name { font-size: 17px; font-weight: 600; color: #1a1a1a; line-height: 1.4; }
.card-time {

.card-category {
  font-size: 12px; color: #999; margin-bottom: 2px;
}

.card-details {

.card.open .card-details { max-height: 1200px; }

.detail-section { padding: 0 22px 0; }
.detail-label {
  font-size: 13px; font-weight: 600; color: #bf9b70;
  margin-bottom: 6px; margin-top: 14px; display: flex; align-items: center; gap: 6px;

.ing-list { list-style: none; }
.ing-list li {
  font-size: 13.5px; color: #444; padding: 2px 0;
  position: relative; padding-left: 16px;
}
.ing-list li::before { content: "•"; position: absolute; left: 0; color: #bf9b70; }

.step-list { list-style: none; counter-reset: step; }
.step-list li {
  counter-increment: step; font-size: 13.5px; color: #444;
  padding: 3px 0 3px 28px; position: relative;
}
.step-list li::before {
  content: counter(step); position: absolute; left: 0; top: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(191,155,112,0.12); color: #bf9b70;
  font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

.tip-box {
  margin: 14px 22px 18px; padding: 12px 14px;
  background: #f9f6f1; border-radius: 10px;
  font-size: 13px; color: #666; line-height: 1.5;
}
.tip-box strong { color: #bf9b70; font-weight: 600; }

.expand-hint {
  text-align: center; padding: 8px 0 14px;
  font-size: 12px; color: #bbb;
  transition: opacity 0.3s;
}
.card.open .expand-hint { opacity: 0; }

/* ── No results ── */
.no-results {
  grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #999; font-size: 15px;
}

/* ── Footer ── */
footer {
  text-align: center; padding: 30px 20px;
  font-size: 12px; color: #bbb; border-top: 1px solid #eee;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  header h1 { font-size: 24px; }
  .grid { grid-template-columns: 1fr; gap: 14px; }
  .tabs { gap: 6px; }
  .tab { font-size: 13px; padding: 8px 16px; }
  .card-inner { padding: 16px 18px; }
}
</style>

// ═══════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════

const grid = document.getElementById("grid");
const tabs = document.querySelectorAll(".tab");
let currentCat = "all";

function render() {
  const filtered = currentCat === "all"
    ? RECIPES
    : RECIPES.filter(r => r.cat === currentCat);

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results">😅 没有找到菜谱</div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => `
    <div class="card" data-id="${r.id}" onclick="toggleCard(this)">
      <div class="card-inner">
        <div class="card-header">
          <div>
            <div class="card-category">${CATEGORIES[r.cat]}</div>
            <div class="card-name">${r.name}</div>
          </div>
          <div class="card-time">🕐 ${r.time}</div>
        </div>
      </div>
      <div class="card-details">
        <div class="detail-section">
          <div class="detail-label">🥬 食材</div>
          <ul class="ing-list">
            ${r.ings.map(i => `<li>${i}</li>`).join("")}
          </ul>
        </div>
        <div class="detail-section">
          <div class="detail-label">👩‍🍳 做法</div>
          <ol class="step-list">
            ${r.steps.map(s => `<li>${s}</li>`).join("")}
          </ol>
        </div>
        ${r.tip ? `<div class="tip-box"><strong>💡 小贴士</strong> ${r.tip}</div>` : ""}
      </div>
      <div class="expand-hint">点击展开完整做法</div>
    </div>
  `).join("");
}

function toggleCard(el) {
  el.classList.toggle("open");
}

// ── Tabs ──
tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentCat = tab.dataset.cat;
    render();
    // Scroll to grid
    grid.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

// ── Init ──
render();
console.log(`Loaded ${RECIPES.length} recipes`);
</script>
